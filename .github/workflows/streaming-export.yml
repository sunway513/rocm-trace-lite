name: Streaming export (CPU)
on:
  pull_request:
    paths:
      - '.github/workflows/streaming-export.yml'
      - 'rocm_trace_lite/cmd_convert.py'
      - 'rocm_trace_lite/cmd_trace.py'
      - 'rocm_trace_lite/cli.py'
      - 'tests/test_streaming_convert.py'
      - 'tests/fixtures/streaming-convert-golden.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff
      - name: Check packaged converter and bounded RSS
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q -s tests/test_streaming_convert.py tests/test_trace_generation.py tests/test_cli.py tests/test_trace_interrupt.py tests/test_trace_interrupt_cli.py 2>&1 | tee streaming-export-tests.log
          ruff check rocm_trace_lite/cmd_convert.py rocm_trace_lite/cmd_trace.py tests/test_streaming_convert.py --select E,F,W --ignore E501,E402
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-export-cpu-evidence
          path: streaming-export-tests.log
