name: Completion safety
on: [pull_request, workflow_dispatch]
jobs:
  cpu-worker:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:latest
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y g++ libsqlite3-dev python3-pip
      - run: pip install --break-system-packages pytest
      - run: python3 -m pytest tests/test_native_completion.py -v
  gpu-shutdown:
    runs-on: linux-rocm-trace-lite-mi355-1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Drain live GPU work at shutdown
        run: |
          docker run --rm --device=/dev/kfd --device=/dev/dri \
            --group-add render --group-add video \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            rocm/dev-ubuntu-24.04:latest bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y libsqlite3-dev python3-pip
              pip install --break-system-packages pytest
              make -j4 librtl.so
              /opt/rocm/bin/hipcc -O2 tests/shutdown_workload.hip -ldl -o tests/shutdown_workload
              python3 -m pytest tests/test_gpu_shutdown.py -v --junitxml=completion-safety.xml
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-safety
          path: completion-safety.xml
