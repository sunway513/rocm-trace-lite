name: GPU Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GPU_CONTAINER: vllm/vllm-openai-rocm@sha256:72e90adf360ccffb231a098a15eadfb808719c029c6cd43f6386095064552b7e

jobs:
  gpu-single:
    name: GPU tests (single MI355X)
    runs-on: linux-rocm-trace-lite-mi355-1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run GPU tests in container
        run: |
          set -o pipefail
          device_groups=()
          while read -r gid; do device_groups+=(--group-add "$gid"); done < <(stat -c %g /dev/kfd /dev/dri/renderD* | sort -u)
          docker run --rm "${device_groups[@]}" \
            --device=/dev/kfd --device=/dev/dri \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            --entrypoint bash \
            ${{ env.GPU_CONTAINER }} \
            -c '
              set -e

              # Build librtl.so + HIP test workload
              apt-get update -qq && apt-get install -y -qq libsqlite3-dev python3-pip > /dev/null 2>&1
              make -j$(nproc)
              make tests/gpu_workload
              mkdir -p rocm_trace_lite/lib && cp librtl.so rocm_trace_lite/lib/

              # Install Python test dependencies
              pip install --break-system-packages pytest pytest-timeout -e .

              # Verify GPU via HIP
              ./tests/gpu_workload noop
              echo "GPU verified via HIP"

              python3 tools/check_graph_capture.py --devices 0 --output /workspace/graph-single

              # Run GPU tests
              python3 -m pytest tests/test_gpu_hip.py -v --tb=short --timeout=120 2>&1 | tee /workspace/gpu-test-results.txt

              # Guard: fail if no GPU tests passed
              gpu_passed=$(grep -c "PASSED" /workspace/gpu-test-results.txt || echo 0)
              echo "GPU tests passed: $gpu_passed"
              if [ "$gpu_passed" -lt 5 ]; then
                echo "FATAL: fewer than 5 GPU tests passed"
                exit 1
              fi
            '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-single-results
          path: gpu-test-results.txt

  gpu-multi:
    name: GPU tests (8x MI355X, optional)
    runs-on: linux-rocm-trace-lite-mi355-8
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run GPU tests in container
        run: |
          set -o pipefail
          device_groups=()
          while read -r gid; do device_groups+=(--group-add "$gid"); done < <(stat -c %g /dev/kfd /dev/dri/renderD* | sort -u)
          docker run --rm "${device_groups[@]}" \
            --device=/dev/kfd --device=/dev/dri \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            --entrypoint bash \
            ${{ env.GPU_CONTAINER }} \
            -c '
              set -e

              # Build librtl.so + HIP test workload
              apt-get update -qq && apt-get install -y -qq libsqlite3-dev python3-pip > /dev/null 2>&1
              make -j$(nproc)
              make tests/gpu_workload
              mkdir -p rocm_trace_lite/lib && cp librtl.so rocm_trace_lite/lib/

              # Install Python test dependencies
              pip install --break-system-packages pytest pytest-timeout -e .

              # Verify GPU
              ./tests/gpu_workload noop
              echo "GPU verified via HIP"

              python3 tools/check_graph_capture.py --devices 0,1,2,3,4,5,6,7 --output /workspace/graph-multi

              # CPU tests run in their dedicated job; this job validates GPU capture.
              python3 -m pytest tests/test_gpu_hip.py -v --tb=short --timeout=180 2>&1 | tee /workspace/gpu-test-results.txt

              # Guard
              gpu_passed=$(grep -c "PASSED" /workspace/gpu-test-results.txt || echo 0)
              echo "GPU tests passed: $gpu_passed"
              if [ "$gpu_passed" -lt 10 ]; then
                echo "FATAL: fewer than 10 tests passed"
                exit 1
              fi
            '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-multi-results
          path: gpu-test-results.txt
