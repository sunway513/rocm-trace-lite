name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Makefile'
      - 'rocm_trace_lite/_build.py'
      - 'tools/verify_release.py'
      - 'tools/check_source_build_failure.py'
      - 'tools/pull_ci_image.sh'
      - 'tools/build_gpu_test_runtime.py'
      - 'tools/check_graph_capture.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  GPU_CONTAINER: rocm/dev-ubuntu-24.04@sha256:a90cf047f615abe70fbef83c64def0a2d549ef37a39c8ea545430aba4981b374
  GPU_RUNTIME_CONTAINER: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254

jobs:
  build-wheel:
    name: Build and verify sdist/wheel (ROCm 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: rocm/dev-ubuntu-24.04@sha256:a90cf047f615abe70fbef83c64def0a2d549ef37a39c8ea545430aba4981b374
    env:
      LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm/core-10.0/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq python3-venv libsqlite3-dev
          python3 -m venv /tmp/build-venv
          /tmp/build-venv/bin/pip install build wheel setuptools twine
      - name: Build wheel from the sdist and verify a fresh installation
        run: |
          set -eu
          /tmp/build-venv/bin/python -m build --no-isolation
          /tmp/build-venv/bin/python -m twine check --strict dist/*
          /tmp/build-venv/bin/python tools/verify_release.py dist
          /tmp/build-venv/bin/python tools/check_source_build_failure.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error

      - name: Package native test runtime from the pinned build image
        run: |
          set -eu
          /tmp/build-venv/bin/python tools/build_gpu_test_runtime.py \
            --output gpu-runtime-artifact/gpu-test-runtime.tar.gz \
            --source-image "$GPU_CONTAINER"
          cd gpu-runtime-artifact
          sha256sum gpu-test-runtime.tar.gz > SHA256SUMS
          gzip -t gpu-test-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-test-runtime
          path: gpu-runtime-artifact/*
          if-no-files-found: error

  installed-gpu:
    name: Installed wheel (8x MI355X)
    needs: build-wheel
    runs-on: linux-rocm-trace-lite-mi355-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/
      - name: Download compact GPU runtime
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gpu-test-runtime
          path: gpu-runtime-artifact/
      - name: Check runtime download integrity
        id: runtime-download-check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd gpu-runtime-artifact
          sha256sum --check SHA256SUMS
          gzip -t gpu-test-runtime.tar.gz
      - name: Remove incomplete runtime download before retry
        if: steps.runtime-download-check.outcome == 'failure'
        shell: bash
        run: rm -f gpu-runtime-artifact/gpu-test-runtime.tar.gz gpu-runtime-artifact/SHA256SUMS
      - name: Retry compact GPU runtime download
        if: steps.runtime-download-check.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-runtime
          path: gpu-runtime-artifact/
      - name: Require complete runtime archive before GPU validation
        shell: bash
        run: |
          set -euo pipefail
          cd gpu-runtime-artifact
          sha256sum --check SHA256SUMS
          gzip -t gpu-test-runtime.tar.gz
      - name: Pull small pinned runtime base with bounded retries
        shell: bash
        run: bash tools/pull_ci_image.sh "$GPU_RUNTIME_CONTAINER" "$GITHUB_WORKSPACE/image-pull.log"
      - name: Validate installed-wheel graph capture on eight GPUs
        shell: bash
        run: |
          set -euo pipefail
          device_groups=()
          while read -r gid; do device_groups+=(--group-add "$gid"); done < <(stat -c %g /dev/kfd /dev/dri/renderD* | sort -u)
          docker run --rm "${device_groups[@]}" \
            --device=/dev/kfd --device=/dev/dri \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/workspace" -w /tmp \
            --entrypoint bash "$GPU_RUNTIME_CONTAINER" -c '
              set -euo pipefail
              tar -xzf /workspace/gpu-runtime-artifact/gpu-test-runtime.tar.gz -C /tmp
              cd /tmp/gpu-test-runtime
              sha256sum --check SHA256SUMS
              export LD_LIBRARY_PATH=/tmp/gpu-test-runtime/lib
              mkdir -p /workspace/wheel-gpu
              cp manifest.json /workspace/wheel-gpu/runtime-manifest.json
              echo "$(date -u +%FT%TZ) phase=install-system-dependencies"
              apt-get update -qq
              apt-get install -y -qq python3-venv libstdc++6 libsqlite3-0
              echo "$(date -u +%FT%TZ) phase=verify-artifacts-and-install-wheel"
              cd /workspace/dist
              sha256sum --check SHA256SUMS
              cd /tmp
              python3 -m venv /tmp/installed
              /tmp/installed/bin/pip install --no-index --no-deps /workspace/dist/*.whl
              /tmp/installed/bin/python -I -c "from pathlib import Path; import sys; from rocm_trace_lite import get_lib_path; p=Path(get_lib_path()).resolve(); assert Path(sys.prefix) in p.parents; print(p)"
              echo "$(date -u +%FT%TZ) phase=validate-installed-graph-capture"
              /tmp/installed/bin/python /workspace/tools/check_graph_capture.py \
                --installed --workload /tmp/gpu-test-runtime/graph_stress \
                --devices 0,1,2,3,4,5,6,7 --output /workspace/wheel-gpu
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-wheel-gpu-evidence
          path: |
            image-pull.log
            wheel-gpu/summary.json
            wheel-gpu/runtime-manifest.json
            wheel-gpu/*.log

  release:
    name: Create GitHub Release
    needs: [build-wheel, installed-gpu]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/
      - name: Create release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          flags=()
          if [[ "$tag" == *rc* || "$tag" == *a[0-9]* || "$tag" == *b[0-9]* || "$tag" == *dev* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* --verify-tag "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "rocm-trace-lite $tag" \
            --notes-file docs/release-notes.md
